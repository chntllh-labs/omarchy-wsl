<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
      <feOffset dx="0" dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="titlebarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#24283b"/>
      <stop offset="100%" stop-color="#1f2335"/>
    </linearGradient>
  </defs>

  <!-- Window Container -->
  <g filter="url(#shadow)">
    <!-- Terminal Background -->
    <rect x="30" y="25" width="900" height="610" rx="12" fill="#1a1b26" stroke="#292e42" stroke-width="1.5"/>

    <!-- Title Bar -->
    <path d="M 30,37 A 12,12 0 0,1 42,25 L 918,25 A 12,12 0 0,1 930,37 L 930,68 L 30,68 Z" fill="url(#titlebarGrad)"/>
    <line x1="30" y1="68" x2="930" y2="68" stroke="#292e42" stroke-width="1"/>

    <!-- Window Controls -->
    <circle cx="56" cy="46" r="6.5" fill="#f7768e"/>
    <circle cx="76" cy="46" r="6.5" fill="#e0af68"/>
    <circle cx="96" cy="46" r="6.5" fill="#9ece6a"/>

    <!-- Window Title -->
    <text x="480" y="51" fill="#7aa2f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" letter-spacing="0.4">
      omarchy@windows ❯ ~ (Tokyo Night)
    </text>
    <rect x="790" y="38" width="115" height="18" rx="4" fill="#13141c" stroke="#414868" stroke-width="0.8"/>
    <text x="847" y="51" fill="#7dcfff" font-family="monospace" font-size="10.5" text-anchor="middle">WSL 3.0 • ARM64</text>

    <!-- Terminal Content Area -->
    <g font-family="'Cascadia Code', 'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="12.5" xml:space="preserve">
      
      <!-- Command 1: omarchy-doctor -->
      <text x="55" y="96" fill="#7aa2f7" font-weight="bold">❯</text>
      <text x="75" y="96" fill="#bb9af7" font-weight="bold">omarchy-doctor</text>

      <!-- Doctor Output -->
      <text x="55" y="118" fill="#7dcfff" font-weight="bold">System</text>
      <text x="65" y="136" fill="#9ece6a">  ✓</text>
      <text x="85" y="136" fill="#c0caf5">systemd is PID 1 (state: running)</text>
      <text x="65" y="154" fill="#9ece6a">  ✓</text>
      <text x="85" y="154" fill="#c0caf5">running under WSL as 'Omarchy'</text>
      <text x="65" y="172" fill="#9ece6a">  ✓</text>
      <text x="85" y="172" fill="#c0caf5">Windows interop active (/mnt/c mounted)</text>
      <text x="65" y="190" fill="#9ece6a">  ✓</text>
      <text x="85" y="190" fill="#c0caf5">WSL sysctl tuning applied (dirty_ratio: 10, vfs_cache_pressure: 100)</text>

      <text x="55" y="214" fill="#7dcfff" font-weight="bold">User</text>
      <text x="65" y="232" fill="#9ece6a">  ✓</text>
      <text x="85" y="232" fill="#c0caf5">user <tspan fill="#e0af68">developer</tspan> (uid 1000, groups: wheel,docker)</text>
      <text x="65" y="250" fill="#9ece6a">  ✓</text>
      <text x="85" y="250" fill="#c0caf5">lingering enabled (agent jobs survive terminal exit)</text>
      <text x="65" y="268" fill="#9ece6a">  ✓</text>
      <text x="85" y="268" fill="#c0caf5">passwordless sudo configured</text>

      <text x="55" y="292" fill="#7dcfff" font-weight="bold">Packages &amp; Theming</text>
      <text x="65" y="310" fill="#9ece6a">  ✓</text>
      <text x="85" y="310" fill="#c0caf5">nvim 0.12.5 • tmux 3.7c (dual prefix C-b / C-a) • git 2.56.0 • yay 13.0.1</text>
      <text x="65" y="328" fill="#9ece6a">  ✓</text>
      <text x="85" y="328" fill="#c0caf5">mise 2026.10.0 • uv 0.12.23 • node 26.10.0 • claude 2.1.289</text>
      <text x="65" y="346" fill="#9ece6a">  ✓</text>
      <text x="85" y="346" fill="#c0caf5">Tokyo Night palette synchronized across Windows Terminal &amp; VS Code</text>

      <!-- Command 2: fastfetch -->
      <text x="55" y="380" fill="#7aa2f7" font-weight="bold">❯</text>
      <text x="75" y="380" fill="#bb9af7" font-weight="bold">fastfetch</text>

      <!-- Fastfetch ASCII Logo & Specs Columns -->
      <!-- Left: Logo -->
      <g fill="#7aa2f7">
        <text x="55" y="405">██████████████████████████████████</text>
        <text x="55" y="423">  ██              ██              ██</text>
        <text x="55" y="441">  ██   █████████████       ████   ██</text>
        <text x="55" y="459">  ██   ██                    ██   ██</text>
        <text x="55" y="477">  ██   ██                    ██   ██</text>
        <text x="55" y="495">  ███████                    ██   ██</text>
        <text x="55" y="513">  ██   ██                    ██   ██</text>
        <text x="55" y="531">  ██   ██                    ██   ██</text>
        <text x="55" y="549">  ██   ████████████████████████   ██</text>
        <text x="55" y="567">  ██              ██              ██</text>
        <text x="55" y="585">  ██████████████████   █████████████</text>
      </g>

      <!-- Right: Specs -->
      <g fill="#c0caf5">
        <text x="400" y="405"><tspan fill="#7aa2f7" font-weight="bold">OS:</tspan> Omarchy 4.0.4 (WSL Rolling)</text>
        <text x="400" y="423"><tspan fill="#7aa2f7" font-weight="bold">Host:</tspan> Windows 11 Pro ARM64 (Hyper-V Micro-VM)</text>
        <text x="400" y="441"><tspan fill="#7aa2f7" font-weight="bold">Kernel:</tspan> Linux 6.18.40.1-microsoft-standard-WSL2</text>
        <text x="400" y="459"><tspan fill="#7aa2f7" font-weight="bold">Uptime:</tspan> 5 hours, 50 mins</text>
        <text x="400" y="477"><tspan fill="#7aa2f7" font-weight="bold">Packages:</tspan> 416 (pacman), yay, mise</text>
        <text x="400" y="495"><tspan fill="#7aa2f7" font-weight="bold">Shell:</tspan> bash 5.2.37 with Starship (Tokyo Night)</text>
        <text x="400" y="513"><tspan fill="#7aa2f7" font-weight="bold">Display Server:</tspan> WSLg 1.0.79 (Wayland native)</text>
        <text x="400" y="531"><tspan fill="#7aa2f7" font-weight="bold">CPU:</tspan> Qualcomm Snapdragon X Elite @ 4.0 GHz (18 cores)</text>
        <text x="400" y="549"><tspan fill="#7aa2f7" font-weight="bold">Memory:</tspan> 2.15 GiB / 48.00 GiB (4%)</text>
        <text x="400" y="567"><tspan fill="#7aa2f7" font-weight="bold">Disk (ext4):</tspan> 12.63 GiB / 1006.85 GiB (1%)</text>

        <!-- Color Palette Dots -->
        <g transform="translate(400, 582)">
          <circle cx="8" cy="8" r="7" fill="#15161e"/>
          <circle cx="28" cy="8" r="7" fill="#f7768e"/>
          <circle cx="48" cy="8" r="7" fill="#9ece6a"/>
          <circle cx="68" cy="8" r="7" fill="#e0af68"/>
          <circle cx="88" cy="8" r="7" fill="#7aa2f7"/>
          <circle cx="108" cy="8" r="7" fill="#bb9af7"/>
          <circle cx="128" cy="8" r="7" fill="#7dcfff"/>
          <circle cx="148" cy="8" r="7" fill="#a9b1d6"/>
          
          <circle cx="178" cy="8" r="7" fill="#414868"/>
          <circle cx="198" cy="8" r="7" fill="#ff7a93"/>
          <circle cx="218" cy="8" r="7" fill="#b9f27c"/>
          <circle cx="238" cy="8" r="7" fill="#ff9e64"/>
          <circle cx="258" cy="8" r="7" fill="#7da6ff"/>
          <circle cx="278" cy="8" r="7" fill="#bb9af7"/>
          <circle cx="298" cy="8" r="7" fill="#0db9d7"/>
          <circle cx="318" cy="8" r="7" fill="#c0caf5"/>
        </g>
      </g>
    </g>
  </g>
</svg>
