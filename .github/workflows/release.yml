name: Release

# Builds Omarchy-x86_64.wsl and Omarchy-arm64.wsl natively, gates them, attests
# their provenance and publishes them. Pushing a v* tag publishes a release;
# workflow_dispatch builds and gates without publishing.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests (${{ matrix.runner }})
    strategy:
      fail-fast: true
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Build the test environment
        run: docker build -t omarchy-wsl-test -f tests/ci/Containerfile tests/ci
      - name: Run every suite (strict, skips fail)
        run: docker run --rm --network host -v "$PWD:/src" -w /src -e OMW_STRICT=1 omarchy-wsl-test tests/run-all.sh

  build:
    name: Build ${{ matrix.asset }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            asset: Omarchy-x86_64.wsl
            runner: ubuntu-24.04
          - arch: arm64
            asset: Omarchy-arm64.wsl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space for the image build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h /

      - name: Build, audit and archive (deterministic, leak self-test)
        run: scripts/build-reproducible-rootfs.sh "${{ matrix.arch }}" --verify-determinism --self-test-leak

      - name: Archive contents, one check per path
        run: |
          set -euo pipefail
          listing=$(mktemp)
          tar -tvzf "dist/${{ matrix.asset }}" >"$listing"
          has() { awk '{print $NF}' "$listing" | grep -qx -- "$1" || { echo "missing: $1"; return 1; }; }
          hasnt() { ! awk '{print $NF}' "$listing" | grep -qE -- "$1" || { echo "must not ship: $1"; return 1; }; }
          mode() { awk -v p="$1" '$NF == p {print $1}' "$listing" | grep -qx -- "$2" || { echo "$1 mode is not $2"; return 1; }; }
          fail=0
          for p in etc/wsl.conf etc/wsl-distribution.conf etc/os-release etc/omarchy-wsl-release \
                   usr/lib/wsl/oobe.sh usr/lib/wsl/omarchy.ico usr/lib/wsl/terminal-profile.json \
                   etc/profile.d/00-omarchy-firstboot.sh etc/systemd/logind.conf.d/10-omarchy-linger.conf \
                   usr/bin/omarchy-doctor usr/bin/omarchy-update usr/bin/omarchy-theme-set usr/bin/omarchy-version \
                   usr/share/omarchy-wsl/manifest-pkg.sha256 usr/lib/libc_nonshared.a etc/machine-id; do
            has "$p" || fail=1
          done
          for p in '^\.dockerenv$' '^etc/resolv\.conf$' '^etc/hostname$' '^etc/pacman\.d/gnupg/' \
                   '^var/cache/pacman/pkg/.' '^root/\.ssh/' '^home/[^/]+/' '^etc/ssh/ssh_host_' '^etc/sudoers\.d/.'; do
            hasnt "$p" || fail=1
          done
          mode usr/bin/sudo -rwsr-xr-x || fail=1
          mode var/tmp/ drwxrwxrwt || fail=1
          mode tmp/ drwxrwxrwt || fail=1
          exit "$fail"

      - name: Booted-image gates (pacman -Sy, gcc, sudo 4755, OOBE, manifest, systemd-analyze)
        run: scripts/smoke-test-image.sh "dist/${{ matrix.asset }}"

      - name: Attest build provenance (SLSA)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@v4
        with:
          subject-path: dist/${{ matrix.asset }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
          retention-days: 7
          if-no-files-found: error

  release:
    name: Sign and publish
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          cp ../install/install.ps1 .
          sha256sum Omarchy-x86_64.wsl Omarchy-arm64.wsl install.ps1 >SHA256SUMS
          cat SHA256SUMS

      - uses: sigstore/cosign-installer@v4

      - name: Sign SHA256SUMS (keyless, Sigstore bundle)
        working-directory: dist
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      - name: Release notes
        run: |
          cat >RELEASE_NOTES.md <<EOF
          Omarchy ${GITHUB_REF_NAME#v} for Windows Subsystem for Linux.

          ## Install (PowerShell)
          \`\`\`powershell
          irm https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/install/install.ps1 | iex
          \`\`\`
          or download the file for your CPU and run \`wsl --install --from-file <file>\`:
          - \`Omarchy-x86_64.wsl\` (Intel/AMD)
          - \`Omarchy-arm64.wsl\` (Snapdragon and other ARM64 PCs)

          ## Verify
          \`\`\`
          sha256sum -c SHA256SUMS --ignore-missing
          gh attestation verify Omarchy-arm64.wsl --repo ${GITHUB_REPOSITORY}
          cosign verify-blob --bundle SHA256SUMS.sigstore.json \\
            --certificate-identity-regexp 'https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/v.*' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS
          \`\`\`

          ## Update an existing install
          \`omarchy update\` (system packages, mise, Neovim, migrations) and
          \`omarchy-wsl-update --self ${GITHUB_REF_NAME}\` (the omarchy-wsl package itself).
          EOF

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "Omarchy WSL ${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md \
            dist/Omarchy-x86_64.wsl dist/Omarchy-arm64.wsl dist/install.ps1 dist/SHA256SUMS dist/SHA256SUMS.sigstore.json
