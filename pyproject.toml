[project]
name = "omarchy-wsl"
version = "4.5.0"
description = "Omarchy (Basecamp) packaged as a Windows Subsystem for Linux distribution"
license = { text = "MIT" }
requires-python = ">=3.10"

[tool.pytest.ini_options]
# lib/ holds the omarchy_theme package the tests import directly.
pythonpath = ["lib"]
testpaths = ["tests"]
addopts = "-ra"
