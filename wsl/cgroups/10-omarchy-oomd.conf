# /etc/systemd/oomd.conf.d/10-omarchy-oomd.conf
# Omarchy-WSL Userspace OOM Daemon Policy
# Monitors Pressure Stall Information (PSI) when supported by the host WSL kernel.

[OOM]
# Kill processes in memory-pressured cgroups when 10-second memory pressure exceeds 60%
DefaultMemoryPressureLimit=60%
DefaultMemoryPressureDurationSec=10s
