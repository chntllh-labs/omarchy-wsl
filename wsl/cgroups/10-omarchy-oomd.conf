# /etc/systemd/oomd.conf.d/10-omarchy-oomd.conf
# Omarchy-WSL policy for systemd-oomd (userspace OOM killer driven by Pressure
# Stall Information). Inert unless systemd-oomd.service is enabled and the WSL
# kernel exposes PSI (/proc/pressure/memory).

[OOM]
# Default memory-pressure limit for units with ManagedOOMMemoryPressure=kill
# that do not set their own limit (build.slice sets 60% explicitly).
DefaultMemoryPressureLimit=60%
# How long pressure must stay above the limit before oomd acts.
DefaultMemoryPressureDurationSec=10s
