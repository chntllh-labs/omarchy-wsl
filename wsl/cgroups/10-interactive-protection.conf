# Omarchy-WSL interactive session priority.
# Installed as /etc/systemd/system/user-.slice.d/10-interactive-protection.conf
# (applies to every user-UID.slice of the system manager).
# Only [Slice] resource-control directives are valid here; OOM score
# adjustment is a per-process exec setting and cannot be set on a slice.
[Slice]
# Login sessions (shells, editors, tmux) outweigh system services (default
# weight 100) and the system-manager build.slice (weight 20) by 10x or more
# when the CPU is contended. Without contention nothing is throttled.
CPUWeight=1000

# Same priority for block I/O (effective with a weight-aware I/O scheduler).
IOWeight=1000
