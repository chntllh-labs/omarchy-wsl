[Unit]
Description=Omarchy-WSL Interactive Session Priority & OOM Shield

[Slice]
# --- High Interactive CPU Scheduling ---
# Gives interactive user shells, editors (Neovim), and multiplexers (tmux) top scheduler priority
# over background builds and compiler jobs (which run at CPUWeight=100).
CPUWeight=1000

# --- High I/O Priority ---
# Interactive typing and terminal buffer flushes bypass compiler target/ directory write queues.
IOWeight=1000

# --- OOM Protection Shield ---
# Demotes likelihood of interactive sessions being selected by the kernel OOM killer during memory pressure.
OOMScoreAdjust=-200
