# ==============================================================================
# Omarchy WSL: WSLg PulseAudio Client Tuning
# /etc/pulse/client.conf.d/wslg.conf
# ==============================================================================
# WSLg runs the PulseAudio server in its system distro and exposes it to every
# user distro as /mnt/wslg/PulseServer; audio reaches Windows over RDP
# (RDPSink for playback, RDPSource for the microphone).
#
# WSL exports PULSE_SERVER only into interactive wsl.exe sessions. systemd
# --user services (speech/STT daemons, MPD, notification sounds) do not inherit
# it, so the server is pinned here as the client-library default.
# Precedence: $PULSE_SERVER > ~/.config/pulse/client.conf.d > this file.
# NOTE: if ~/.config/pulse/client.conf exists, PulseAudio skips /etc/pulse/*.
# ==============================================================================

# Talk to WSLg's server; never fall back to a locally spawned daemon.
default-server = unix:/mnt/wslg/PulseServer

# A distro-local pulseaudio/pipewire-pulse must not autospawn and silently
# capture clients: it has no route to the Windows audio stack.
autospawn = no

# Client and server share one kernel (the WSL2 utility VM), so memfd-backed
# zero-copy transport works across the distro boundary. POSIX shm does not
# (each distro has its own /dev/shm) and is skipped in favour of memfd.
enable-memfd = yes

# Larger shm pool so long STT capture buffers don't fall back to socket copies.
shm-size-bytes = 67108864
