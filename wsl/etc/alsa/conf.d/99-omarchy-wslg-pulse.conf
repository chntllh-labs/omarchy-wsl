# /etc/alsa/conf.d/99-omarchy-wslg-pulse.conf
# Route raw ALSA applications (arecord, whisper.cpp, sox, older games) through
# the WSLg PulseAudio server. WSL2 has no ALSA hardware devices at all.
# Requires alsa-plugins (pulse PCM plugin) and libpulse.
pcm.!default {
  type pulse
  hint {
    show on
    description "WSLg PulseAudio (Windows audio)"
  }
}
ctl.!default {
  type pulse
}
