# ==============================================================================
# Omarchy WSL: Hardened Podman & Netavark Configuration
# /etc/containers/containers.conf
# ==============================================================================
# Eliminates corporate VPN subnet overlaps, MTU fragmentation, and
# mirrored networking adapter clashes for rootless and rootful Podman.
# ==============================================================================

[containers]
# Modern OCI runtime
default_capabilities = [
  "CHOWN",
  "DAC_OVERRIDE",
  "FOWNER",
  "FSETID",
  "KILL",
  "NET_BIND_SERVICE",
  "SETFCAP",
  "SETGID",
  "SETPCAP",
  "SETUID",
  "SYS_CHROOT"
]

[network]
# Use Netavark network stack with iptables/nftables compatibility
network_backend = "netavark"

# Default MTU clamped to 1420 to prevent packet loss across corporate VPN tunnels
default_network = "podman"
default_subnet = "198.19.0.0/16"
default_subnet_pools = [
  {"base" = "198.19.0.0/16", "size" = 24}
]

# Rootless pasta network flags: enforce MTU 1420
pasta_options = ["-m", "1420", "--tcp-ports", "auto", "--udp-ports", "auto"]

# Forward DNS lookups to local stub resolver with public fallback
dns_bind_port = 0
default_rootless_network_cmd = "pasta"

[engine]
cgroup_manager = "systemd"
events_logger = "journald"
log_driver = "journald"
