# ==============================================================================
# Omarchy WSL: Podman / Netavark configuration
# /etc/containers/containers.conf
# ==============================================================================
# Keeps container subnets out of the RFC1918 ranges corporate VPNs route, and
# clamps the rootless (pasta) MTU for VPN encapsulation. DNS: containers use
# the resolvers from /etc/resolv.conf (generated by WSL); there is no local
# stub resolver in this image (systemd-resolved is masked).
# ==============================================================================

[containers]
default_capabilities = [
  "CHOWN",
  "DAC_OVERRIDE",
  "FOWNER",
  "FSETID",
  "KILL",
  "NET_BIND_SERVICE",
  "SETFCAP",
  "SETGID",
  "SETPCAP",
  "SETUID",
  "SYS_CHROOT"
]
log_driver = "journald"

[network]
network_backend = "netavark"

# Rootful bridge networks: 198.19.0.0/16 (RFC 2544 benchmark space, which
# corporate networks do not route) instead of the 10.88.0.0/16 default.
default_network = "podman"
default_subnet = "198.19.0.0/16"
default_subnet_pools = [
  {"base" = "198.19.0.0/16", "size" = 24}
]

# Rootless networking via pasta with MTU 1420 (VPN encapsulation headroom).
# Ports are only published with an explicit -p; pasta's automatic forwarding
# of every bound port is deliberately not enabled.
default_rootless_network_cmd = "pasta"
pasta_options = ["-m", "1420"]

[engine]
cgroup_manager = "systemd"
events_logger = "journald"
