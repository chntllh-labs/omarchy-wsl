# /etc/sysctl.d/99-zz-omarchy-wsl-stability.conf
#
# HARDENED WSL MEMORY & KERNEL STABILITY POLICY
# Lexicographical ordering: '99-zz' guarantees this applies AFTER any upstream
# Omarchy defaults (e.g. 99-omarchy-sysctl.conf) to prevent kernel panic via
# memory allocation starvation (kswapd0 order:0 failures).

# VM Memory Management & Reclaim
# vfs_cache_pressure: 50 prioritizes dentry/inode metadata retention in RAM,
# accelerating Neovim LSP, Git status, and ripgrep on large codebases.
# On memory-constrained VMs (<8GB), 100 prevents slab bloat.
vm.vfs_cache_pressure = 50

# WSL 2/3.0.1 virtio/paging tuning; prevent swap exhaustion
vm.swappiness = 10

# Guarantee 128MB free page reserve in Normal Zone for atomic/interrupt allocations
vm.min_free_kbytes = 131072

# Standard heuristic memory overcommit
vm.overcommit_memory = 0

# Low dirty writeback thresholds for smooth I/O pacing on 9p/virtio-fs mounts
# Prevents multi-gigabyte page cache accumulations that freeze interactive shells
# during parallel builds (make/cargo -j18).
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5
vm.dirty_expire_centisecs = 1000
vm.dirty_writeback_centisecs = 250

# Network Socket Scalability (mirrored networking mode compatibility)
net.core.somaxconn = 4096
net.ipv4.tcp_fastopen = 3

# File Descriptors & Inodes (scaled for large monorepos and concurrent LSP engines)
fs.file-max = 2097152
fs.inotify.max_user_watches = 1048576
fs.inotify.max_user_instances = 8192
