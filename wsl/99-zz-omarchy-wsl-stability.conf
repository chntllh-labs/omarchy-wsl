# ==============================================================================
# /etc/sysctl.d/99-zz-omarchy-wsl-stability.conf
#
# HARDENED WSL MEMORY & KERNEL STABILITY POLICY (FINAL LEXICOGRAPHICAL OVERRIDE)
# ==============================================================================
# Lexicographical ordering: '99-zz' guarantees this applies AFTER any upstream
# Omarchy defaults (e.g. 99-omarchy-sysctl.conf) to prevent kernel panic via
# memory allocation starvation (kswapd0 order:0 failures, Incident 2026-09-10).
# ==============================================================================

# --- VM Memory Management & Reclaim ---
# CRITICAL: vm.vfs_cache_pressure must be 100.
# A value of 50 causes dentry/inode slab caches to resist reclaim, accumulating
# gigabytes of unreclaimable slab memory under containerized services, file indexers,
# and continuous git operations, starving the buddy allocator of order:0 pages.
vm.vfs_cache_pressure = 100

# WSL virtio/paging tuning: keep swappiness low (10) to prioritize physical RAM
# during active compilations while preserving swap as an essential emergency relief valve.
vm.swappiness = 10

# Guarantee 128 MB free page reserve in Normal Zone for atomic/interrupt allocations.
# Completely eliminates kswapd0 order:0 page allocation failures under burst I/O.
vm.min_free_kbytes = 131072

# Standard heuristic memory overcommit
vm.overcommit_memory = 0

# Low dirty writeback thresholds for smooth I/O pacing on 9p/virtiofs mounts.
# Prevents multi-gigabyte unwritten page cache bursts that stall interactive shells.
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5
vm.dirty_expire_centisecs = 1000
vm.dirty_writeback_centisecs = 250

# High-core lock fairness (prevents page lock starvation on 18-core Snapdragon Oryon).
vm.page_lock_unfairness = 1

# --- Network Socket Scalability (mirrored networking mode compatibility) ---
net.core.somaxconn = 4096
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_max_syn_backlog = 4096

# --- File Descriptors & Inodes ---
fs.file-max = 2097152
fs.inotify.max_user_watches = 1048576
fs.inotify.max_user_instances = 8192
