# ==============================================================================
# Omarchy WSL: Hardened systemd-resolved Configuration
# /etc/systemd/resolved.conf.d/10-omarchy-wsl.conf
# ==============================================================================
# Eliminates corporate VPN, Zscaler, and mirrored networking conflicts.
# ==============================================================================

[Resolve]
# 1. Disable DNSSEC Validation
# Corporate proxies, Zscaler, and Windows DNS tunneling strip or forge RRSIG
# records for internal and external domains. Enforcing DNSSEC causes total
# SERVFAIL resolution failure on enterprise networks.
DNSSEC=no

# 2. Disable LLMNR and MulticastDNS
# In Windows 11 mirrored networking mode, Linux shares network ports with Windows.
# Windows host svchost already listens on UDP 5355 (LLMNR) and 5353 (mDNS).
# Disabling these prevents port bind errors and network stack interference.
LLMNR=no
MulticastDNS=no

# 3. Disable Strict DNS over TLS
# Enterprise SSL inspection proxies intercept and block outbound TLS on port 853.
DNSOverTLS=no

# 4. Global Fallback Nameservers
# If Windows host DNS tunneling is unreachable or VPN drops connection,
# systemd-resolved falls back to resilient public anycast resolvers.
FallbackDNS=1.1.1.1 8.8.8.8 9.9.9.9 2606:4700:4700::1111 2001:4860:4860::8888

# 5. Local Stub Resolver & Cache
# Caches DNS records locally to dramatically speed up pacman and development tools.
DNSStubListener=yes
Cache=yes
