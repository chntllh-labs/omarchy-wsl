# ==============================================================================
# Omarchy WSL: systemd-resolved drop-in (DORMANT, opt-in only)
# /etc/systemd/resolved.conf.d/10-omarchy-wsl.conf
# ==============================================================================
# The Omarchy-WSL image masks systemd-resolved and lets WSL generate
# /etc/resolv.conf (wsl.conf: generateResolvConf = true). This file has no
# effect in that default setup.
#
# It only matters if you opt in to systemd-resolved yourself:
#   1. wsl.conf: [network] generateResolvConf = false, then `wsl --shutdown`
#   2. systemctl unmask --now systemd-resolved
#   3. ln -sf ../run/systemd/resolve/stub-resolv.conf /etc/resolv.conf
#   4. give resolved an upstream (DNS= below or `resolvectl dns eth0 <ip>`);
#      WSL's eth0 has no DHCP client, so resolved learns none by itself.
# omarchy-dns-sync leaves a symlinked /etc/resolv.conf alone.
# ==============================================================================

[Resolve]
# Inspecting proxies and split-horizon corporate DNS often return answers that
# fail DNSSEC validation; validation turns them into SERVFAIL.
DNSSEC=no

# In mirrored networking Windows already uses UDP 5353 (mDNS) and 5355 (LLMNR)
# on the shared stack.
LLMNR=no
MulticastDNS=no

# Port 853 is commonly blocked by enterprise egress filtering.
DNSOverTLS=no

# Intentionally no FallbackDNS: public fallbacks leak internal names past a VPN
# and answer NXDOMAIN for split-horizon zones. An empty value disables
# resolved's compiled-in public fallback list.
FallbackDNS=

DNSStubListener=yes
Cache=yes
