# /etc/systemd/logind.conf.d/10-omarchy-linger.conf
#
# Keep user processes (tmux servers, background builds, user services) alive
# when the last terminal or SSH session of a user closes. This is logind's
# upstream default on Arch, stated explicitly so a distribution or admin
# override elsewhere cannot silently start killing sessions on logout. The OOBE
# also enables lingering for the owner, so user@1000.service outlives sessions.
[Login]
KillUserProcesses=no
