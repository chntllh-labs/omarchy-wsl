# /etc/wsl.conf for Omarchy on WSL.
# ==============================================================================
# Read by WSL when the distribution starts (wsl --terminate <name> to apply a
# change). The OOBE adds [user] default = <owner> once it has created the
# account with uid 1000; omarchy-rename-owner keeps it in sync.
# ==============================================================================

[boot]
systemd = true

[automount]
enabled = true
root = /mnt/
# DrvFs masks are OR-ed: files 0744, directories 0755, owned by uid 1000.
# Other Linux users can read the Windows profile; see
# docs/MULTI-TENANT-ISOLATION.md before adding accounts.
options = "metadata,uid=1000,gid=1000,umask=022,fmask=011,case=off"
mountFsTab = true

[network]
generateResolvConf = true

[interop]
enabled = true
# Keep Windows directories off PATH: lookups through /mnt/c are slow and shadow
# Linux tools (node, python, git). Windows programs remain callable by full
# path; the Omarchy bridges resolve them through /usr/lib/omarchy-wsl/interop.sh.
appendWindowsPath = false
