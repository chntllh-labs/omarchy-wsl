# /etc/wsl.conf - Omarchy-WSL Base System Configuration
# ==============================================================================
# Base WSL configuration applied at virtualization boot time.
# The dynamic OOBE engine (oobe.sh) will atomically inject [user] default=<user>
# upon first-boot user provisioning.
# ==============================================================================

[boot]
systemd = true

[automount]
enabled = true
root = /mnt/
options = "metadata,uid=1000,gid=1000,umask=022,fmask=011,case=off"
mountFsTab = true

[network]
generateResolvConf = true

[interop]
enabled = true
appendWindowsPath = false
