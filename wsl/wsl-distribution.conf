# /etc/wsl-distribution.conf
# Read by `wsl --install --from-file` or `wsl --import` during distro OOBE setup

[oobe]
command = /usr/lib/omarchy-wsl/oobe.sh
defaultUid = 1000
defaultName = aqua

[shortcut]
enabled = true
icon = /usr/share/omarchy/icon.ico

[windowsterminal]
enabled = true
ProfileTemplate = /usr/share/omarchy/wsl/terminal-profile.json
