# /etc/wsl-distribution.conf
# ==============================================================================
# Omarchy WSL Distribution Configuration Specification
# ==============================================================================
# Evaluated by Windows Subsystem for Linux (WSL) upon distribution registration,
# first-boot OOBE initialization, and Windows Start menu / Terminal integration.
#
# Reference: https://learn.microsoft.com/en-us/windows/wsl/build-custom-distro
# ==============================================================================

[oobe]
# Command executed as root (UID 0) on first interactive or automated launch
command = /usr/lib/omarchy-wsl/oobe.sh

# Default UID launched by WSL once oobe.command succeeds (exits with code 0)
defaultUid = 1000

# Canonical distribution registration name in WSL (replaces hardcoded aqua/omarchy)
defaultName = Omarchy

[shortcut]
# Generate a Windows Start Menu shortcut upon distribution installation
enabled = true
# Icon path inside rootfs (ICO format, < 10MB)
icon = /usr/share/omarchy/assets/omarchy.ico

[windowsterminal]
# Generate an integrated Windows Terminal profile upon distribution installation
enabled = true
# Terminal JSON profile template configuring Tokyo Night color scheme and Cascadia Code
ProfileTemplate = /usr/share/omarchy/assets/terminal-profile.json
