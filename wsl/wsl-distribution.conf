# /etc/wsl-distribution.conf
# ==============================================================================
# Read by WSL when the .wsl file is installed (wsl --install --from-file, or a
# double-click), on the first launch, and for the Start menu and Windows
# Terminal integration. Reference:
#   https://learn.microsoft.com/windows/wsl/build-custom-distro
#
# WslDistributionConfig.cpp reads the icon and the terminal profile with a
# 1 MiB limit (UtilReadFileRaw(path, 1024 * 1024)); both files below are kept
# well under it and the build fails if either grows past it.
#
# wsl --import never runs [oobe]; /etc/profile.d/00-omarchy-firstboot.sh runs
# the same OOBE on the first interactive root login instead.
# ==============================================================================

[oobe]
# Runs as root on the first launch; WSL logs in as defaultUid once it exits 0.
command = /usr/lib/wsl/oobe.sh
defaultUid = 1000
defaultName = Omarchy

[shortcut]
enabled = true
icon = /usr/lib/wsl/omarchy.ico

[windowsterminal]
enabled = true
ProfileTemplate = /usr/lib/wsl/terminal-profile.json
