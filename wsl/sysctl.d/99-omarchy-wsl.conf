# ==============================================================================
# /etc/sysctl.d/99-omarchy-wsl.conf
# Omarchy WSL: Kernel Memory Management & Virtualization Tuning
# ==============================================================================
# Hardened for Snapdragon X Elite (18-core Oryon ARM64) and high-core x86_64.
# Loaded automatically by systemd-sysctl.service during early boot.
# ==============================================================================

# --- VM Memory Management & Reclaim ---
# CRITICAL RESILIENCE: vm.vfs_cache_pressure must be 100 (never 50!).
# In WSL2, vfs_cache_pressure = 50 causes unreclaimable slab/dentry bloat under
# continuous container, language server, and git workloads, triggering kswapd0
# order:0 page allocation failures and kernel lockups (Incident 2026-09-10).
vm.vfs_cache_pressure = 100

# Keep anonymous pages in fast physical RAM during normal compilations;
# swap acts strictly as an escape valve under acute memory pressure.
# Avoids premature swap churn (swappiness > 50) and fatal refault storms (swappiness = 0).
vm.swappiness = 10

# Guarantee 128 MB free page reserve in Normal Zone for atomic/interrupt allocations.
# Completely eliminates kswapd0 order:0 page allocation failures under burst I/O.
vm.min_free_kbytes = 131072

# Standard heuristic memory overcommit (default Linux heuristic, avoids malloc panics).
vm.overcommit_memory = 0

# Smooth I/O pacing: low dirty writeback thresholds prevent massive latency stalls
# on Hyper-V virtual disk (ext4.vhdx) and 9p/virtiofs host mounts.
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5
vm.dirty_expire_centisecs = 1000
vm.dirty_writeback_centisecs = 250

# High-core lock fairness (mitigates page lock starvation on 18-core Snapdragon Oryon).
vm.page_lock_unfairness = 1

# --- Network Socket Scalability (Mirrored Networking & VPN Compatibility) ---
net.core.somaxconn = 4096
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_max_syn_backlog = 4096

# --- File Descriptors & Inotify Watchers ---
# Essential for large monorepos, Neovim, rust-analyzer, clangd, tsserver, and Vite/Cargo watch.
fs.file-max = 2097152
fs.inotify.max_user_watches = 1048576
fs.inotify.max_user_instances = 8192
