# ==============================================================================
# Omarchy WSL: Kernel & Virtualization Tuning
# ==============================================================================
# Tuned for high-core ARM64 (Snapdragon X Elite / Oryon) and x86_64 hosts.
# Loaded automatically by systemd-sysctl.service.
# ==============================================================================

# Memory writeback and reclamation
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5
vm.dirty_expire_centisecs = 1000
vm.dirty_writeback_centisecs = 250
vm.vfs_cache_pressure = 50
vm.swappiness = 10
vm.min_free_kbytes = 131072

# Networking: deep accept queues for local development & mirrored networking
net.core.somaxconn = 4096
net.ipv4.tcp_fastopen = 3

# File descriptors and inotify scalability for language servers & file watchers
fs.file-max = 2097152
fs.inotify.max_user_watches = 1048576
fs.inotify.max_user_instances = 8192
