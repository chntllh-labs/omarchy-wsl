# ==============================================================================
# Omarchy WSL: network sysctls
# /etc/sysctl.d/99-zz-omarchy-wsl-network.conf
# ==============================================================================
# '99-zz' sorts after distribution and upstream Omarchy defaults, so these
# values win. Everything here is VM-wide: WSL2 runs every distro in one VM.
# ==============================================================================

# 1. Privileged ports stay privileged (kernel default 1024, set explicitly so
#    an earlier drop-in that lowers it to 0 is overridden). With 0, any local
#    user could bind 22, 53 or 443 and impersonate a system service; in
#    mirrored networking such a port is also reachable on the host's LAN
#    address. To serve a dev site on 80/443 without root, grant the binary the
#    capability (setcap cap_net_bind_service=+ep) or use a reverse proxy, or
#    opt in deliberately: sysctl net.ipv4.ip_unprivileged_port_start=80
net.ipv4.ip_unprivileged_port_start = 1024

# 2. Loose reverse-path filtering: VPN clients (GlobalProtect, AnyConnect) and
#    mirrored virtual adapters can route a flow's egress and ingress through
#    different interfaces; strict mode (1) would drop those packets.
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2

# 3. Forwarding is NOT enabled here. dockerd ("ip-forward": true, the default)
#    and netavark turn on net.ipv4.ip_forward themselves when they create a
#    bridge, so the VM only routes when a container engine needs it.
#    route_localnet stays 0 (loopback addresses must never become routable)
#    and IPv6 forwarding stays off (enabling it disables router-advertisement
#    processing on every interface).

# 4. Listen backlog for local microservices.
net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 4096
net.ipv4.tcp_fastopen = 3

# 5. Keepalives below typical corporate firewall idle timeouts (5-10 min), so
#    long downloads and SSH sessions are not dropped silently.
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 5
net.ipv4.tcp_fin_timeout = 15

# 6. TCP window scaling, timestamps and SACK (kernel defaults, pinned).
net.ipv4.tcp_window_scaling = 1
net.ipv4.tcp_timestamps = 1
net.ipv4.tcp_sack = 1
