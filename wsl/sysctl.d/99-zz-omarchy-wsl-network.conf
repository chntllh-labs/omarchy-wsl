# ==============================================================================
# Omarchy WSL: Hardened Network & Multi-Adapter Kernel Configuration
# /etc/sysctl.d/99-zz-omarchy-wsl-network.conf
# ==============================================================================
# Lexicographical ordering '99-zz' ensures this applies AFTER any distribution
# defaults to protect against asymmetric VPN routes and socket starvation.
# ==============================================================================

# 1. Unprivileged Port Binding
# Allows non-root development user ('aqua', UID 1000) to bind ports 80/443 directly.
net.ipv4.ip_unprivileged_port_start = 0

# 2. Asymmetric Routing & Multi-Homed VPN Compatibility
# Mode 2 (Loose Reverse Path Filter) prevents kernel from dropping packets when
# corporate VPN tunnels (GlobalProtect, AnyConnect) or mirrored virtual adapters
# route egress and ingress via different interfaces.
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
net.ipv4.conf.all.route_localnet = 1

# 3. Container & Bridge Forwarding
# Enables packet forwarding required by Docker (docker0) and Podman bridges.
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1

# 4. High-Throughput Socket Scalability
# Deep listen backlog queue preventing SYN drops under microservice loads.
net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 4096
net.ipv4.tcp_fastopen = 3

# 5. Connection Keepalive & Stateful Firewall Resilience
# Corporate firewalls (Zscaler/Palo Alto) drop idle connections after 5-10 minutes.
# Aggressive keepalives prevent silent connection drops during long build downloads.
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 5
net.ipv4.tcp_fin_timeout = 15

# 6. TCP Window & Memory Scaling
net.ipv4.tcp_window_scaling = 1
net.ipv4.tcp_timestamps = 1
net.ipv4.tcp_sack = 1
