# ==============================================================================
# Omarchy WSL: memory & kernel stability sysctls (final override)
# /etc/sysctl.d/99-zz-omarchy-wsl-stability.conf
# ==============================================================================
# '99-zz' sorts after upstream Omarchy defaults (e.g. 99-omarchy-*.conf), so a
# migration that ships different VM tunables cannot override these. The
# Omarchy WSL migration gate re-applies this file after running upstream
# migrations.
# ==============================================================================

# --- VM memory management & reclaim ---
# vm.vfs_cache_pressure stays at the kernel default 100. Lower values (50) make
# dentry/inode slab caches resist reclaim; under container, indexer and git
# workloads that slab growth was observed to starve order-0 allocations
# (kswapd page-allocation failures) in WSL2.
vm.vfs_cache_pressure = 100

# Low swappiness keeps compiler working sets in RAM while leaving swap as an
# emergency relief valve (0 would invite refault storms).
vm.swappiness = 10

# 128 MiB free-page reserve for atomic/interrupt allocations under burst I/O.
vm.min_free_kbytes = 131072

# Default heuristic overcommit.
vm.overcommit_memory = 0

# Early, steady writeback instead of multi-gigabyte dirty-page bursts that
# stall interactive shells (ext4.vhdx and 9p/virtiofs mounts).
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5
vm.dirty_expire_centisecs = 1000
vm.dirty_writeback_centisecs = 250

# Fairer page-lock handoff on many-core hosts (kernel default is 5).
vm.page_lock_unfairness = 1

# --- File descriptors & inotify (large monorepos, LSPs, file watchers) ---
fs.file-max = 2097152
fs.inotify.max_user_watches = 1048576
fs.inotify.max_user_instances = 8192
