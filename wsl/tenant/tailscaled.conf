# /etc/systemd/system/tailscaled.service.d/10-omarchy-tenant.conf inside an
# omarchy-tenant guest (managed file). Userspace networking: no TUN device and
# no routes inside the tenant. Inbound tailnet TCP is forwarded to the
# tenant's localhost (sshd). `omarchy-tenant auth-url` runs
# `tailscale up --ssh=false --accept-dns=false --accept-routes=false`.
[Service]
ExecStart=
ExecStart=/usr/bin/tailscaled --tun=userspace-networking --state=/var/lib/tailscale/tailscaled.state --socket=/run/tailscale/tailscaled.sock --port=0
