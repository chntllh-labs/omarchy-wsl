# /usr/lib/environment.d/50-omarchy-wslg.conf
# Environment for the systemd --user manager and all user services.
# WSLg's PulseAudio server (playback + microphone).
PULSE_SERVER=unix:/mnt/wslg/PulseServer
# Client-side buffer target. 60 ms trades a little latency for far fewer client
# underruns on the RDP audio path; speech-to-text pipelines are insensitive to
# it. Override per app: PULSE_LATENCY_MSEC=20 mpv ...
PULSE_LATENCY_MSEC=60
