# /etc/tmpfiles.d/wsl-nvme-io.conf
#
# WSL NVMe & VHDX Block Device Throughput Optimization
#
# Increases read-ahead cache from 128KB default to 1024KB (1MB) on virtual block devices.
# Expands block request queue depth (nr_requests) to 256 for parallel I/O queues.
# Applied deterministically by systemd-tmpfiles at boot.

w /sys/block/sd*/queue/read_ahead_kb - - - - 1024
w /sys/block/vd*/queue/read_ahead_kb - - - - 1024
w /sys/block/sd*/queue/nr_requests - - - - 256
w /sys/block/vd*/queue/nr_requests - - - - 256
