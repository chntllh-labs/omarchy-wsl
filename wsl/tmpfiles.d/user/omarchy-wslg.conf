# /usr/share/user-tmpfiles.d/omarchy-wslg.conf
# systemd mounts a fresh tmpfs on /run/user/$UID, hiding the WSLg sockets WSL
# placed there. Recreate them as symlinks into /mnt/wslg/runtime-dir.
# 'L' (not 'L+') never replaces an existing entry, so a deliberately installed
# pipewire-pulse or a native Wayland compositor keeps working.
L %t/pulse          - - - - /mnt/wslg/runtime-dir/pulse
L %t/wayland-0      - - - - /mnt/wslg/runtime-dir/wayland-0
L %t/wayland-0.lock - - - - /mnt/wslg/runtime-dir/wayland-0.lock
