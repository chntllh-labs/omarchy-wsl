# /usr/share/omarchy/tmux/omarchy-clipboard.conf
# source-file /usr/share/omarchy/tmux/omarchy-clipboard.conf
#
# Copy-mode yanks go to the Windows clipboard (local) or through OSC 52 to the
# outer terminal (SSH). Windows Terminal accepts OSC 52 writes but never reads.

# Forward OSC 52 from applications (Neovim, omarchy-clip osc52) to the outer
# terminal and into tmux buffers. Default is "external" (tmux-originated only).
set -s set-clipboard on
# Let DCS-wrapped sequences (OSC 52 / OSC 777 notifications) reach the terminal.
set -g allow-passthrough on
# Windows Terminal speaks OSC 52 even when its terminfo lacks Ms.
set -as terminal-features ',xterm-256color:clipboard'

# tmux >= 3.2: used by copy-pipe without an explicit command.
set -s copy-command 'omarchy-clip copy'
bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'omarchy-clip copy'
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel 'omarchy-clip copy'
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'omarchy-clip copy'
# prefix C-v: paste the Windows clipboard into the pane (prefix ] still pastes
# the tmux buffer).
bind C-v run-shell "omarchy-clip paste | tmux load-buffer - && tmux paste-buffer"
