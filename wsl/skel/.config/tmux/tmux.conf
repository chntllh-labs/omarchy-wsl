# Omarchy's tmux configuration, followed by the WSL overrides below.
source-file /usr/share/omarchy/config/tmux/tmux.conf

# Dual prefix: Ctrl-b (the tmux default) and Ctrl-a (screen-style), replacing
# upstream's Ctrl-Space, which Windows input methods and some terminals eat.
# Both work in every key table that uses the prefix.
set -g prefix C-b
set -g prefix2 C-a
unbind C-Space
bind -N "Send prefix" C-b send-prefix
bind -N "Send secondary prefix" C-a send-prefix -2

# Copy-mode yanks reach the Windows clipboard (local session) or the outer
# terminal through OSC 52 (SSH session); see omarchy-clip.
source-file -q /usr/share/omarchy/tmux/omarchy-clipboard.conf
