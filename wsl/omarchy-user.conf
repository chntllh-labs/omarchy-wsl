# /etc/omarchy-user.conf - Omarchy-WSL account settings
# ==============================================================================
# Read by /usr/lib/wsl/oobe.sh and omarchy-rename-owner with a whitelist parser:
# this file is never sourced. Syntax: KEY=VALUE or KEY="VALUE", full-line #
# comments only, no shell expansion, no inline comments.
#
# DEFAULT_USER
#   Preseeds the owner name for the first OOBE run: headless runs use it,
#   interactive runs offer it as the default. It must already be a valid name
#   (^[a-z_][a-z0-9_-]*$, at most 31 characters). Once uid 1000 exists the
#   OOBE records the owner here for reference only; identity is always uid
#   1000, and omarchy-rename-owner keeps this value in sync.
#
# OMARCHY_HOME_DIRS
#   Extra directories the OOBE creates in the owner's home, space separated
#   and relative to the home. Each path component must start with a letter,
#   digit or "_" (no absolute paths, no "..", no hidden dirs); at most 32.
#   Example: OMARCHY_HOME_DIRS="code notes"
# ==============================================================================
OMARCHY_HOME_DIRS=""
